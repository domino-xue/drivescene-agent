[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drivescene-agent"
version = "0.1.0"
description = "Interactive autonomous-driving scenario mining agent."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.4",
    "langchain-openai>=0.3",
    "langgraph>=1.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "streamlit>=1.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
