name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Validate generated planner benchmark
        run: python scripts/build_planner_eval_dataset.py && git diff --exit-code -- evals/agent_planner_cases_200.jsonl evals/agent_planner_cases_200.manifest.json
      - name: Runtime ablation smoke test
        run: python scripts/run_runtime_ablation.py --output runtime-ablation.json
      - name: Offline demo smoke test
        run: python scripts/run_demo.py --json > demo-result.json
